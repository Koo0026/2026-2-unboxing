<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>우와아 주문 · 날개 신발</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>:root {
  --sky-top: #1f2152;
  --sky-bottom: #3d2f70;
  --floor: #5a4a94;
  --gold: #f4c35a;
  --mint: #8fe6d4;
  --scarf: #d6524a;
  --parchment: #fff4dc;
  --ink: #2a1f3d;
  --moon: #f3eeff;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) { --sky-top: #2a2c6e; --sky-bottom: #4b3c86; --floor: #6a5aa6; }
}
:root[data-theme="light"] { --sky-top: #2a2c6e; --sky-bottom: #4b3c86; --floor: #6a5aa6; }
:root[data-theme="dark"] { --sky-top: #1f2152; --sky-bottom: #3d2f70; --floor: #5a4a94; }

*, *::before, *::after { box-sizing: inherit; }
html, body, #root { height: 100%; margin: 0; }
body {
  background: var(--sky-top);
  color: var(--moon);
  font-family: 'Jua', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif;
  -webkit-font-smoothing: antialiased;
}

.app {
  height: 100%;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto;
  justify-items: center;
  background:
    radial-gradient(ellipse 60% 18% at 50% 88%, color-mix(in srgb, var(--floor) 80%, transparent), transparent 70%),
    radial-gradient(1.5px 1.5px at 12% 18%, #fff9 50%, transparent 51%),
    radial-gradient(1.5px 1.5px at 78% 12%, #fff8 50%, transparent 51%),
    radial-gradient(2px 2px at 88% 40%, #fff7 50%, transparent 51%),
    radial-gradient(1.5px 1.5px at 22% 52%, #fff6 50%, transparent 51%),
    radial-gradient(2px 2px at 64% 28%, #fff9 50%, transparent 51%),
    linear-gradient(180deg, var(--sky-top), var(--sky-bottom));
  overflow: hidden;
}

.top {
  width: 100%;
  max-width: 960px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 14px 18px 4px;
}
.top h1 {
  margin: 0;
  font-weight: 400;
  font-size: clamp(22px, 4vw, 30px);
  color: var(--gold);
  letter-spacing: 0.01em;
  white-space: nowrap;
}
@media (max-width: 520px) {
  .top { padding: 10px 12px 2px; }
  .ghost { font-size: 13px; padding: 5px 10px; }
}
.tools { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.ghost {
  font: inherit;
  font-size: 15px;
  color: var(--moon);
  background: transparent;
  border: 1.5px solid color-mix(in srgb, var(--moon) 35%, transparent);
  border-radius: 999px;
  padding: 6px 12px;
  cursor: pointer;
}
.ghost:disabled { opacity: 0.4; cursor: default; }

.stage { width: 100%; max-width: 960px; min-height: 280px; }

/* 하단: 애니메이션이 끝나면 '한 번 더 보기' (재생 중에도 자리는 유지) */
.tray {
  width: 100%;
  max-width: 960px;
  display: grid;
  justify-items: center;
  padding: 6px 12px 18px;
}
.tray.playing .again { visibility: hidden; }
.again {
  font: inherit;
  font-size: 22px;
  color: var(--ink);
  background: var(--gold);
  border: none;
  border-radius: 999px;
  padding: 14px 30px;
  box-shadow: 0 5px 0 #b98a2c;
  cursor: pointer;
}
.again:active { transform: translateY(3px); box-shadow: 0 2px 0 #b98a2c; }

button:focus-visible { outline: 3px solid var(--mint); outline-offset: 3px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

@media (max-height: 620px) {
  .top { padding-top: 8px; }
}
</style>
