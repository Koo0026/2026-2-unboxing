<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>마법 책 펼침 연출</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    --stage-0:#141131;
    --stage-1:#2e2a63;
    --ink:#f3f0ff;
    --ink-dim:#b8b4e0;
    --gold:#f3b93c;
    --gold-soft:#ffe08a;
    --panel:rgba(20,17,49,.52);
    --panel-line:rgba(243,185,60,.28);
  }
  *,*::before,*::after{ box-sizing:inherit; }
  html,body{ height:100%; margin:0; }
  html{ scroll-padding-top: env(safe-area-inset-top, 0px); }
  body{
    background:var(--stage-0);
    color:var(--ink);
    font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
    overflow:hidden;
  }
  #root{ height:100%; }

  .stage{ position:relative; height:100%; width:100%; overflow:hidden; }
  .stage canvas{ display:block; width:100%; height:100%; }

  .flash{
    position:absolute; inset:0; pointer-events:none; opacity:0;
    background:radial-gradient(circle at 68% 62%, #fffdf3 0%, rgba(255,246,214,.92) 22%, rgba(214,206,255,.55) 55%, rgba(255,255,255,0) 82%);
    mix-blend-mode:screen;
  }

  .caption{
    position:absolute; left:clamp(16px,4vw,40px); top:clamp(14px,3.5vw,32px);
    max-width:min(62ch,52%); pointer-events:none;
  }
  .caption h1{
    margin:0; font-family:"Gowun Batang","Noto Sans KR",serif;
    font-size:clamp(20px,3.4vw,34px); font-weight:700; letter-spacing:.01em;
    color:var(--gold-soft); text-shadow:0 2px 18px rgba(20,17,49,.9);
  }
  .caption p{
    margin:.5em 0 0; font-size:clamp(12px,1.5vw,15px); line-height:1.65;
    color:var(--ink-dim); text-shadow:0 1px 10px rgba(20,17,49,.95);
  }

  .hud{
    position:absolute; left:50%; transform:translateX(-50%);
    bottom:calc(clamp(14px,3vw,28px) + env(safe-area-inset-bottom, 0px));
    display:flex; flex-wrap:wrap; gap:8px; align-items:center; justify-content:center;
    padding:9px 12px; border-radius:999px;
    background:var(--panel); border:1px solid var(--panel-line);
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  }
  .hud button{
    font:inherit; font-size:13px; font-weight:700; color:var(--ink);
    padding:8px 15px; border-radius:999px; cursor:pointer;
    border:1px solid rgba(243,240,255,.22); background:rgba(243,240,255,.07);
    transition:background .15s ease, border-color .15s ease, transform .1s ease;
  }
  .hud button:hover{ background:rgba(243,240,255,.15); }
  .hud button:active{ transform:translateY(1px); }
  .hud button:focus-visible{ outline:2px solid var(--gold); outline-offset:2px; }
  .hud button.primary{
    color:#1c1638; background:linear-gradient(180deg,var(--gold-soft),var(--gold));
    border-color:rgba(255,224,138,.9);
  }
  .hud button[aria-pressed="true"]{
    border-color:var(--gold); color:var(--gold-soft); background:rgba(243,185,60,.14);
  }
  .hud .phase{
    font-size:12px; color:var(--ink-dim); padding:0 8px; min-width:7.5em; text-align:center;
    font-variant-numeric:tabular-nums;
  }

  .fallback{ padding:24px; font-size:14px; line-height:1.7; color:var(--ink-dim); }

  @media (max-width:520px){
    .caption{ max-width:78%; }
    .hud .phase{ order:-1; width:100%; }
  }
  @media (prefers-reduced-motion:reduce){
    .flash{ display:none; }
  }
</style>
</head>
<body>
<div id="root"><div class="fallback">불러오는 중…</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.128.0/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.24.7/babel.min.js"></script>

<script type="text/babel" data-presets="react">
/* =========================================================================
   마법 책 펼침 연출 — React + three.js
   씬 로직은 createMagicBookScene(mount, flashEl, opts) 안에 전부 들어 있고,
   React는 마운트 / 리사이즈 / 리플레이 / 속도만 관리합니다.
   그래서 이 파일의 씬 코드를 그대로 다른 React 프로젝트로 옮길 수 있습니다.
   ========================================================================= */

const PALETTE = {
  coverA: '#3a4c8a',
  coverB: '#1d2856',
  gold:   '#f3b93c',
  goldLt: '#ffe08a',
  cream:  '#f7efd9',
  lav:    '#cfd2f2',
  wood:   '#8a5a33',
  woodDk: '#5c3a20',
};

/* ---------- 작은 수학/이징 유틸 ---------- */
const clamp01 = v => v < 0 ? 0 : v > 1 ? 1 : v;
const lerp = (a, b, t) => a + (b - a) * t;
const easeOutCubic = t => 1 - Math.pow(1 - t, 3);
const easeOutBack = (t, s = 1.7) => 1 + (s + 1) * Math.pow(t - 1, 3) + s * Math.pow(t - 1, 2);
const easeInOutSine = t => -(Math.cos(Math.PI * t) - 1) / 2;
const rand = (a, b) => a + Math.random() * (b - a);

/* ---------- 캔버스 텍스처 헬퍼 ---------- */
function newCanvas(size) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  return c;
}
function tex(canvas) {
  const t = new THREE.CanvasTexture(canvas);
  t.encoding = THREE.sRGBEncoding;
  t.anisotropy = 4;
  return t;
}
function starPath(ctx, cx, cy, R, r, points) {
  ctx.beginPath();
  for (let i = 0; i < points * 2; i++) {
    const rad = i % 2 ? r : R;
    const a = (i / (points * 2)) * Math.PI * 2 - Math.PI / 2;
    const x = cx + Math.cos(a) * rad;
    const y = cy + Math.sin(a) * rad;
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  ctx.closePath();
}

/* 표지: 남색 바탕 + 금색 테두리 + 금색 별 (업로드한 책 아이콘 팔레트) */
function coverTexture() {
  const c = newCanvas(512), g = c.getContext('2d');
  const grd = g.createLinearGradient(0, 0, 512, 512);
  grd.addColorStop(0, PALETTE.coverA);
  grd.addColorStop(1, PALETTE.coverB);
  g.fillStyle = grd; g.fillRect(0, 0, 512, 512);

  g.strokeStyle = PALETTE.gold; g.lineWidth = 16;
  g.strokeRect(36, 30, 440, 452);
  g.strokeStyle = 'rgba(255,224,138,0.45)'; g.lineWidth = 5;
  g.strokeRect(62, 56, 388, 400);

  g.shadowColor = 'rgba(255,224,138,0.85)'; g.shadowBlur = 26;
  starPath(g, 256, 250, 98, 40, 5);
  g.fillStyle = PALETTE.gold; g.fill();
  g.shadowBlur = 0;
  starPath(g, 256, 250, 52, 20, 5);
  g.fillStyle = PALETTE.goldLt; g.fill();

  [[110, 106], [402, 106], [110, 400], [402, 400]].forEach(([x, y]) => {
    starPath(g, x, y, 20, 7, 4);
    g.fillStyle = 'rgba(255,224,138,0.8)'; g.fill();
  });
  return tex(c);
}

/* 속지: 크림색 + 흐린 글줄 + 금색 룬 점 */
function pageTexture() {
  const c = newCanvas(512), g = c.getContext('2d');
  g.fillStyle = PALETTE.cream; g.fillRect(0, 0, 512, 512);
  g.strokeStyle = 'rgba(120,104,70,0.18)'; g.lineWidth = 3;
  for (let i = 0; i < 13; i++) {
    const y = 90 + i * 26;
    g.beginPath();
    g.moveTo(70, y);
    g.lineTo(70 + rand(240, 372), y);
    g.stroke();
  }
  g.fillStyle = 'rgba(243,185,60,0.55)';
  for (let i = 0; i < 16; i++) {
    starPath(g, rand(70, 440), rand(60, 460), rand(4, 9), rand(1.5, 3), 4);
    g.fill();
  }
  return tex(c);
}

/* 별가루 스프라이트: 가운데 발광 + 십자 섬광 */
function dustTexture() {
  const c = newCanvas(128), g = c.getContext('2d');
  const grd = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  grd.addColorStop(0, 'rgba(255,255,255,1)');
  grd.addColorStop(0.22, 'rgba(255,242,205,0.85)');
  grd.addColorStop(0.55, 'rgba(255,214,120,0.22)');
  grd.addColorStop(1, 'rgba(255,214,120,0)');
  g.fillStyle = grd; g.fillRect(0, 0, 128, 128);
  g.strokeStyle = 'rgba(255,255,255,0.75)'; g.lineCap = 'round';
  g.lineWidth = 3;
  g.beginPath(); g.moveTo(64, 14); g.lineTo(64, 114); g.moveTo(14, 64); g.lineTo(114, 64); g.stroke();
  return tex(c);
}

/* 부드러운 발광 원판 (책 속 빛, 지팡이 섬광) */
function glowTexture() {
  const c = newCanvas(256), g = c.getContext('2d');
  const grd = g.createRadialGradient(128, 128, 0, 128, 128, 128);
  grd.addColorStop(0, 'rgba(255,253,240,0.95)');
  grd.addColorStop(0.3, 'rgba(255,226,150,0.45)');
  grd.addColorStop(0.65, 'rgba(197,190,255,0.16)');
  grd.addColorStop(1, 'rgba(197,190,255,0)');
  g.fillStyle = grd; g.fillRect(0, 0, 256, 256);
  return tex(c);
}

/* 배경: 깊은 남보라 방사 그라데이션 */
function bgTexture() {
  const c = newCanvas(512), g = c.getContext('2d');
  const grd = g.createRadialGradient(256, 300, 20, 256, 300, 380);
  grd.addColorStop(0, '#3b3a72');
  grd.addColorStop(0.55, '#221e4c');
  grd.addColorStop(1, '#100e28');
  g.fillStyle = grd; g.fillRect(0, 0, 512, 512);
  return tex(c);
}

/* 글자 조각: 자모·글자를 캔버스에 그려 스프라이트로 */
const GLYPHS = ['ㄱ','ㄴ','ㄷ','ㄹ','ㅁ','ㅂ','ㅅ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ','ㅏ','ㅓ','ㅗ','ㅜ','가','나','다','라','마','바','사'];
function drawGlyph(canvas, ch) {
  const g = canvas.getContext('2d');
  const S = canvas.width;
  g.clearRect(0, 0, S, S);
  g.font = '900 ' + Math.round(S * 0.72) + 'px "Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif';
  g.textAlign = 'center';
  g.textBaseline = 'middle';
  g.shadowColor = 'rgba(255,224,138,0.95)';
  g.shadowBlur = S * 0.22;
  g.fillStyle = PALETTE.goldLt;
  g.fillText(ch, S / 2, S / 2 + S * 0.02);
  g.shadowBlur = 0;
  g.fillStyle = '#fffaf0';
  g.fillText(ch, S / 2, S / 2 + S * 0.02);
}

/* ---------- 씬 ---------- */
function createMagicBookScene(mount, flashEl, opts = {}) {
  const onPhase = opts.onPhase || (() => {});
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.setClearColor(0x100e28, 1);
  mount.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  scene.background = bgTexture();

  const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
  camera.position.set(0, 0.15, 6.6);

  const root = new THREE.Group();
  scene.add(root);

  const dustMap = dustTexture();
  const glowMap = glowTexture();

  /* ===== 책 ===== */
  const book = new THREE.Group();
  book.rotation.x = -0.44;
  root.add(book);

  const W = 1.36, H = 1.86, T = 0.08;
  const coverMap = coverTexture();
  const pageMap = pageTexture();
  const matCoverFace = new THREE.MeshBasicMaterial({ map: coverMap });
  const matCoverEdge = new THREE.MeshBasicMaterial({ color: 0x1a2350 });
  const matPage = new THREE.MeshBasicMaterial({ map: pageMap, side: THREE.DoubleSide });

  function makeCover(dir) {
    const pivot = new THREE.Group();
    const mats = [matCoverEdge, matCoverEdge, matCoverEdge, matCoverEdge, matCoverFace, matCoverFace];
    const mesh = new THREE.Mesh(new THREE.BoxGeometry(W, H, T), mats);
    mesh.position.set(dir * W / 2, 0, 0);
    pivot.add(mesh);
    book.add(pivot);
    return pivot;
  }
  const leftCover = makeCover(-1);
  const rightCover = makeCover(1);

  function makePages(dir, count, zBase) {
    const arr = [];
    for (let i = 0; i < count; i++) {
      const pivot = new THREE.Group();
      const mesh = new THREE.Mesh(new THREE.PlaneGeometry(W * 0.93, H * 0.93), matPage);
      mesh.position.set(dir * W * 0.47, 0, 0.004 * i);
      pivot.position.z = zBase;
      pivot.add(mesh);
      book.add(pivot);
      arr.push(pivot);
    }
    return arr;
  }
  const leftPages = makePages(-1, 3, T * 0.62);
  const rightPages = makePages(1, 6, T * 0.66);

  // 책 속에서 새어 나오는 빛
  const innerGlow = new THREE.Sprite(new THREE.SpriteMaterial({
    map: glowMap, color: 0xfff1c9, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, opacity: 0,
  }));
  innerGlow.position.set(0, 0.1, 0.25);
  innerGlow.scale.setScalar(3.2);
  book.add(innerGlow);

  /* ===== 지팡이 ===== */
  const wand = new THREE.Group();
  root.add(wand);

  const stick = new THREE.Mesh(
    new THREE.CylinderGeometry(0.035, 0.062, 1.75, 16),
    new THREE.MeshBasicMaterial({ color: PALETTE.wood })
  );
  stick.position.y = -0.87;
  wand.add(stick);
  const grip = new THREE.Mesh(
    new THREE.CylinderGeometry(0.068, 0.068, 0.2, 16),
    new THREE.MeshBasicMaterial({ color: PALETTE.woodDk })
  );
  grip.position.y = -1.52;
  wand.add(grip);

  function starMesh(outer, inner, color) {
    const s = new THREE.Shape();
    for (let i = 0; i < 10; i++) {
      const r = i % 2 ? inner : outer;
      const a = (i / 10) * Math.PI * 2 - Math.PI / 2;
      const x = Math.cos(a) * r, y = Math.sin(a) * r;
      i ? s.lineTo(x, y) : s.moveTo(x, y);
    }
    s.closePath();
    return new THREE.Mesh(new THREE.ShapeGeometry(s), new THREE.MeshBasicMaterial({ color, side: THREE.DoubleSide }));
  }
  const gem = new THREE.Group();
  const gemOuter = starMesh(0.3, 0.12, PALETTE.gold);
  const gemInner = starMesh(0.16, 0.06, 0xfffaf0);
  gemInner.position.z = 0.01;
  gem.add(gemOuter, gemInner);
  gem.position.y = 0.06;
  wand.add(gem);

  const gemGlow = new THREE.Sprite(new THREE.SpriteMaterial({
    map: glowMap, color: 0xffe9b0, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, opacity: 0.4,
  }));
  gemGlow.position.copy(gem.position);
  gemGlow.scale.setScalar(1.2);
  wand.add(gemGlow);

  const wandHome = new THREE.Vector3(2.45, -1.15, 1.1);

  /* ===== 별가루 회오리 ===== */
  function makeVortex(count, size, rMin, rMax, ySpeedRange, tint) {
    const geo = new THREE.BufferGeometry();
    const pos = new Float32Array(count * 3);
    const col = new Float32Array(count * 3);
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
    const mat = new THREE.PointsMaterial({
      size, map: dustMap, vertexColors: true, transparent: true,
      depthWrite: false, blending: THREE.AdditiveBlending, sizeAttenuation: true, opacity: 1,
    });
    const points = new THREE.Points(geo, mat);
    points.frustumCulled = false;
    root.add(points);

    const P = [];
    const base = new THREE.Color();
    for (let i = 0; i < count; i++) {
      const pick = Math.random();
      base.set(pick < 0.45 ? PALETTE.goldLt : pick < 0.78 ? '#ffffff' : PALETTE.lav);
      P.push({
        a: rand(0, Math.PI * 2),
        rBase: rand(rMin, rMax),
        y: rand(0, 2.4),
        ySpeed: rand(ySpeedRange[0], ySpeedRange[1]),
        aSpeed: rand(1.1, 2.6) * (Math.random() < 0.12 ? -1 : 1),
        phase: rand(0, 6.28),
        delay: rand(0, 0.9),
        r: 0,
        cr: base.r * tint, cg: base.g * tint, cb: base.b * tint,
      });
    }
    return { points, geo, mat, P, count };
  }

  const vortices = [
    makeVortex(420, 0.055, 0.12, 1.0, [0.55, 1.3], 1.0),
    makeVortex(190, 0.115, 0.3, 1.5, [0.4, 1.0], 0.9),
    makeVortex(60, 0.24, 0.45, 1.9, [0.3, 0.75], 0.75),
  ];

  function updateVortex(v, t, emit, dt) {
    const pos = v.geo.attributes.position.array;
    const col = v.geo.attributes.color.array;
    for (let i = 0; i < v.count; i++) {
      const p = v.P[i];
      const on = emit > 0 && t > p.delay * 1.2;
      if (!on) {
        pos[i * 3] = 0; pos[i * 3 + 1] = -999; pos[i * 3 + 2] = 0;
        continue;
      }
      p.a += p.aSpeed * dt * (1.35 - 0.16 * p.y);
      p.y += p.ySpeed * dt * (0.55 + 0.75 * emit);
      if (p.y > 2.75) {
        p.y = rand(0.02, 0.2);
        p.a = rand(0, Math.PI * 2);
        p.rBase = rand(0.12, 1.2);
      }
      const spread = 1 + 0.55 * clamp01(p.y / 2.2);
      const wobble = 1 + 0.22 * Math.sin(p.y * 2.1 + p.phase + t * 1.4);
      p.r = p.rBase * spread * wobble;
      pos[i * 3] = Math.cos(p.a) * p.r;
      pos[i * 3 + 1] = -0.15 + p.y;
      pos[i * 3 + 2] = Math.sin(p.a) * p.r * 0.62;

      const rise = clamp01(p.y / 0.35);
      const fade = 1 - clamp01((p.y - 1.7) / 1.05);
      const tw = 0.72 + 0.28 * Math.sin(t * 7 + p.phase);
      const k = rise * fade * tw * (0.35 + 0.65 * emit);
      col[i * 3] = p.cr * k; col[i * 3 + 1] = p.cg * k; col[i * 3 + 2] = p.cb * k;
    }
    v.geo.attributes.position.needsUpdate = true;
    v.geo.attributes.color.needsUpdate = true;
  }

  /* ===== 글자 조각 ===== */
  const glyphs = [];
  const glyphCanvases = [];
  for (let i = 0; i < 22; i++) {
    const ch = GLYPHS[i % GLYPHS.length];
    const canvas = newCanvas(160);
    drawGlyph(canvas, ch);
    const texture = tex(canvas);
    glyphCanvases.push({ canvas, texture, ch });
    const mat = new THREE.SpriteMaterial({
      map: texture, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, opacity: 0,
    });
    const sp = new THREE.Sprite(mat);
    sp.scale.setScalar(0.38);
    root.add(sp);
    glyphs.push({
      sp, mat,
      a: rand(0, Math.PI * 2),
      rBase: rand(0.35, 1.45),
      y: rand(-0.1, 1.9),
      ySpeed: rand(0.42, 0.85),
      aSpeed: rand(0.7, 1.6) * (Math.random() < 0.18 ? -1 : 1),
      spin: rand(-1.1, 1.1),
      size: rand(0.26, 0.5),
      phase: rand(0, 6.28),
      delay: rand(0, 1.3),
    });
  }
  // 한글 웹폰트가 늦게 도착하면 글자 텍스처만 다시 그림
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(() => {
      glyphCanvases.forEach(({ canvas, texture, ch }) => {
        drawGlyph(canvas, ch);
        texture.needsUpdate = true;
      });
    });
  }

  function updateGlyphs(t, env, dt) {
    for (const g of glyphs) {
      const on = env > 0 && t > g.delay;
      if (!on) { g.mat.opacity = 0; continue; }
      g.a += g.aSpeed * dt * (1.15 - 0.12 * g.y);
      g.y += g.ySpeed * dt * (0.6 + 0.6 * env);
      if (g.y > 2.6) {
        g.y = rand(-0.15, 0.1);
        g.a = rand(0, Math.PI * 2);
        g.rBase = rand(0.3, 1.5);
      }
      const r = g.rBase * (1 + 0.5 * clamp01(g.y / 2.2)) * (1 + 0.14 * Math.sin(g.y * 1.7 + g.phase));
      g.sp.position.set(Math.cos(g.a) * r, -0.1 + g.y, Math.sin(g.a) * r * 0.62);
      const rise = clamp01((g.y + 0.2) / 0.5);
      const fade = 1 - clamp01((g.y - 1.5) / 1.1);
      g.mat.opacity = rise * fade * env * 0.95;
      g.mat.rotation = g.spin * (t * 0.7 + g.phase);
      const s = g.size * lerp(0.75, 1.12, rise) * (1 + 0.06 * Math.sin(t * 4 + g.phase));
      g.sp.scale.setScalar(s);
    }
  }

  /* ===== 섬광 순간 지팡이에서 터지는 불꽃 ===== */
  const burstCount = 140;
  const burstGeo = new THREE.BufferGeometry();
  const burstPos = new Float32Array(burstCount * 3);
  const burstCol = new Float32Array(burstCount * 3);
  burstGeo.setAttribute('position', new THREE.BufferAttribute(burstPos, 3));
  burstGeo.setAttribute('color', new THREE.BufferAttribute(burstCol, 3));
  const burstPoints = new THREE.Points(burstGeo, new THREE.PointsMaterial({
    size: 0.12, map: dustMap, vertexColors: true, transparent: true,
    depthWrite: false, blending: THREE.AdditiveBlending, sizeAttenuation: true,
  }));
  burstPoints.frustumCulled = false;
  root.add(burstPoints);
  const burst = [];
  for (let i = 0; i < burstCount; i++) burst.push({ x: 0, y: 0, z: 0, vx: 0, vy: 0, vz: 0, life: 0 });

  function fireBurst(origin) {
    for (const b of burst) {
      const a = rand(0, Math.PI * 2), e = rand(-0.5, 1.1), sp = rand(1.4, 4.2);
      b.x = origin.x; b.y = origin.y; b.z = origin.z;
      b.vx = Math.cos(a) * Math.cos(e) * sp;
      b.vy = Math.sin(e) * sp + 0.6;
      b.vz = Math.sin(a) * Math.cos(e) * sp * 0.6;
      b.life = 1;
    }
  }
  function updateBurst(dt) {
    for (let i = 0; i < burstCount; i++) {
      const b = burst[i];
      if (b.life <= 0) { burstPos[i * 3 + 1] = -999; burstCol[i * 3] = burstCol[i * 3 + 1] = burstCol[i * 3 + 2] = 0; continue; }
      b.life -= dt * 0.85;
      b.vx *= 0.94; b.vy = b.vy * 0.94 - dt * 0.9; b.vz *= 0.94;
      b.x += b.vx * dt; b.y += b.vy * dt; b.z += b.vz * dt;
      burstPos[i * 3] = b.x; burstPos[i * 3 + 1] = b.y; burstPos[i * 3 + 2] = b.z;
      const k = clamp01(b.life) * clamp01(b.life);
      burstCol[i * 3] = k; burstCol[i * 3 + 1] = k * 0.92; burstCol[i * 3 + 2] = k * 0.7;
    }
    burstGeo.attributes.position.needsUpdate = true;
    burstGeo.attributes.color.needsUpdate = true;
  }

  /* ===== 타임라인 ===== */
  const CUE = { wand: 0.0, charge: 0.5, flash: 1.15, pop: 1.2, open: 1.3, letters: 1.45, settle: 6.2, loopAt: 8.4 };
  let elapsed = 0, speed = 1, looping = true, burstFired = false, lastPhase = '';
  let pointer = { x: 0, y: 0 }, pointerTarget = { x: 0, y: 0 };

  function phaseName(t) {
    if (t < CUE.flash) return '지팡이 충전';
    if (t < CUE.open) return '섬광';
    if (t < 2.1) return '책 펼침';
    if (t < CUE.settle) return '별가루 회오리';
    return '잔광';
  }

  function reset() {
    elapsed = 0;
    burstFired = false;
    for (const b of burst) b.life = 0;
    for (const v of vortices) for (const p of v.P) { p.y = rand(0, 0.3); p.delay = rand(0, 0.9); }
    for (const g of glyphs) { g.y = rand(-0.3, 0.2); g.delay = rand(0, 1.3); }
  }
  reset();

  function frame(dt) {
    elapsed += dt;
    const t = elapsed;

    // 지팡이 등장 + 보석 충전
    const inE = easeOutCubic(clamp01((t - CUE.wand) / 0.85));
    wand.position.set(
      lerp(wandHome.x + 0.55, wandHome.x, inE),
      lerp(wandHome.y - 2.1, wandHome.y, inE),
      wandHome.z
    );
    wand.rotation.z = lerp(-0.75, -0.3 + Math.sin(t * 1.1) * 0.02, inE);
    wand.rotation.y = 0.18;

    const charge = clamp01((t - CUE.charge) / 0.6);

    // 섬광: 순간 상승 후 지수 감쇠
    let flash = 0;
    if (t >= CUE.flash) {
      const f = t - CUE.flash;
      flash = f < 0.07 ? f / 0.07 : Math.exp(-(f - 0.07) * 3.1);
    }
    if (!burstFired && t >= CUE.flash) {
      const o = new THREE.Vector3();
      gem.getWorldPosition(o);
      root.worldToLocal(o);
      fireBurst(o);
      burstFired = true;
    }

    const gemK = 0.35 + charge * 0.55 + flash * 2.6 + Math.sin(t * 9) * 0.06 * charge;
    gemGlow.material.opacity = Math.min(1, 0.25 + gemK * 0.55);
    gemGlow.scale.setScalar(1.0 + gemK * 2.4);
    gem.scale.setScalar(1 + flash * 0.35 + charge * 0.08);
    gem.rotation.z = t * 0.6;

    if (flashEl) flashEl.style.opacity = String(Math.min(0.94, flash * 0.94));

    // 책: 팝업 후 빠르게 펼침
    const pop = clamp01((t - CUE.pop) / 0.48);
    const popS = pop <= 0 ? 0 : easeOutBack(pop, 2.1);
    book.scale.setScalar(Math.max(0.0001, popS));
    book.visible = pop > 0;

    const openRaw = clamp01((t - CUE.open) / 0.5);
    const open = openRaw <= 0 ? 0 : easeOutBack(openRaw, 1.35);
    leftCover.rotation.y = lerp(0.02, 0.2, clamp01(open));
    rightCover.rotation.y = lerp(-Math.PI * 0.97, -0.2, clamp01(open));
    leftPages.forEach((p, i) => { p.rotation.y = lerp(0.03, 0.2 + i * 0.022, clamp01(open)); });
    rightPages.forEach((p, i) => {
      const local = easeOutCubic(clamp01((openRaw - i * 0.055) / 0.55));
      p.rotation.y = lerp(-Math.PI * 0.97, -0.2 - i * 0.026, local);
    });

    const idle = clamp01((t - 1.9) / 0.8);
    book.position.y = lerp(-0.05, 0.02 + Math.sin(t * 1.15) * 0.05, idle);
    book.rotation.x = -0.44 + Math.sin(t * 0.85) * 0.018 * idle;
    book.rotation.z = Math.sin(t * 0.62) * 0.02 * idle;
    innerGlow.material.opacity = clamp01(open) * (0.5 + 0.18 * Math.sin(t * 2.6)) + flash * 0.4;
    innerGlow.scale.setScalar(2.6 + clamp01(open) * 0.9 + flash * 1.4);

    // 회오리 세기: 펼침과 함께 폭발, 이후 잔광으로 감쇠
    const swirlUp = clamp01((t - (CUE.open + 0.02)) / 0.35);
    const swirlDown = 1 - 0.62 * clamp01((t - CUE.settle) / 1.4);
    const emit = swirlUp * swirlDown;
    for (const v of vortices) updateVortex(v, t, emit, dt);
    updateGlyphs(t, clamp01((t - CUE.letters) / 0.5) * swirlDown, dt);
    updateBurst(dt);

    // 아주 약한 시차 카메라
    pointer.x += (pointerTarget.x - pointer.x) * Math.min(1, dt * 3);
    pointer.y += (pointerTarget.y - pointer.y) * Math.min(1, dt * 3);
    camera.position.x = pointer.x * 0.45;
    camera.position.y = 0.15 + pointer.y * 0.28;
    camera.lookAt(0, 0.25, 0);

    const ph = phaseName(t);
    if (ph !== lastPhase) { lastPhase = ph; onPhase(ph); }

    if (looping && t > CUE.loopAt) reset();
  }

  /* ===== 루프 / 리사이즈 / 정리 ===== */
  let raf = 0, prev = performance.now(), disposed = false;
  function tick(now) {
    if (disposed) return;
    const dt = Math.min(0.05, (now - prev) / 1000) * speed;
    prev = now;
    frame(reduceMotion ? dt * 0.55 : dt);
    renderer.render(scene, camera);
    raf = requestAnimationFrame(tick);
  }
  raf = requestAnimationFrame(tick);

  function resize() {
    const w = mount.clientWidth || 1, h = mount.clientHeight || 1;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    // 세로 화면에서도 지팡이와 회오리가 프레임 안에 들어오도록 전체 축소
    const s = Math.max(0.52, Math.min(1, (w / h) / 1.35));
    root.scale.setScalar(s);
  }
  resize();
  const ro = new ResizeObserver(resize);
  ro.observe(mount);

  function onPointerMove(e) {
    const r = mount.getBoundingClientRect();
    pointerTarget.x = ((e.clientX - r.left) / r.width - 0.5) * 2;
    pointerTarget.y = -((e.clientY - r.top) / r.height - 0.5) * 2;
  }
  mount.addEventListener('pointermove', onPointerMove);

  return {
    replay: reset,
    setSpeed: v => { speed = v; },
    setLooping: v => { looping = v; },
    dispose() {
      disposed = true;
      cancelAnimationFrame(raf);
      ro.disconnect();
      mount.removeEventListener('pointermove', onPointerMove);
      scene.traverse(o => {
        if (o.geometry) o.geometry.dispose();
        const m = o.material;
        if (Array.isArray(m)) m.forEach(x => x.dispose());
        else if (m) m.dispose();
      });
      renderer.dispose();
      if (renderer.domElement.parentNode) renderer.domElement.parentNode.removeChild(renderer.domElement);
    },
  };
}

/* ---------- React ---------- */
const { useRef, useEffect, useState, useCallback } = React;

function MagicBookReveal() {
  const mountRef = useRef(null);
  const flashRef = useRef(null);
  const sceneRef = useRef(null);
  const [phase, setPhase] = useState('지팡이 충전');
  const [slow, setSlow] = useState(false);
  const [looping, setLooping] = useState(true);

  useEffect(() => {
    const s = createMagicBookScene(mountRef.current, flashRef.current, { onPhase: setPhase });
    sceneRef.current = s;
    return () => s.dispose();
  }, []);

  useEffect(() => { sceneRef.current && sceneRef.current.setSpeed(slow ? 0.35 : 1); }, [slow]);
  useEffect(() => { sceneRef.current && sceneRef.current.setLooping(looping); }, [looping]);

  const replay = useCallback(() => sceneRef.current && sceneRef.current.replay(), []);

  return (
    <div className="stage" ref={mountRef}>
      <div className="flash" ref={flashRef} />
      <div className="caption">
        <h1>마법 책이 펼쳐지는 순간</h1>
        <p>지팡이 끝 별이 번쩍이며 화면을 밝히고, 그 빛에 책이 펼쳐지며 별가루와 글자 조각이 회오리처럼 솟아오릅니다.</p>
      </div>
      <div className="hud">
        <span className="phase">{phase}</span>
        <button className="primary" onClick={replay}>다시 재생</button>
        <button aria-pressed={slow} onClick={() => setSlow(v => !v)}>느리게 보기</button>
        <button aria-pressed={looping} onClick={() => setLooping(v => !v)}>자동 반복</button>
      </div>
    </div>
  );
}

const rootEl = document.getElementById('root');
if (!window.THREE) {
  rootEl.innerHTML = '<div class="fallback">three.js를 불러오지 못했습니다. 네트워크 연결을 확인하고 새로고침해 주세요.</div>';
} else {
  rootEl.innerHTML = '';
  ReactDOM.createRoot(rootEl).render(<MagicBookReveal />);
}
</script>
</body>
</html>
