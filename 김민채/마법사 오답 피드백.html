// 정면 얼굴 표정 (그림 좌표, 얼굴 중심 x=178)
const FACE_BOX = [110, 154, 140, 120];
const FACE_KINDS = ["normal", "blink", "shock", "dizzy", "teary", "determined"];
function drawFace(g, kind) {
    const EYE = "#3b2523", BROW = "#5a3a30", MOUTH = "#6b3337", L = 147, R = 209, EY = 204;
    const ln = (w, c) => { g.lineWidth = w; g.strokeStyle = c; g.lineCap = "round"; g.lineJoin = "round"; };
    g.save();
    g.translate(-6, 0); // 비스듬한 머리에 맞춰 이목구비를 옮겨 화면 정면을 바라보게
    const blush = (k) => {
        g.fillStyle = "rgba(240,128,128," + (0.45 * k) + ")";
        [L - 15, R + 15].forEach((x) => { g.beginPath(); g.ellipse(x, 226, 12 * k, 7 * k, 0, 0, Math.PI * 2); g.fill(); });
    };
    const brows = (dy, tilt) => {
        ln(3.2, BROW);
        [[L, 1], [R, -1]].forEach(([x, s]) => {
            g.beginPath();
            g.moveTo(x - 11, 186 + dy - tilt * s);
            g.quadraticCurveTo(x, 183 + dy, x + 11, 186 + dy + tilt * s);
            g.stroke();
        });
    };
    const ovalEyes = (sy) => {
        [L, R].forEach((x) => {
            g.beginPath();
            g.ellipse(x, EY, 7.5, 10 * sy, 0, 0, Math.PI * 2);
            g.fillStyle = EYE;
            g.fill();
            g.fillStyle = "#fff";
            g.beginPath();
            g.arc(x + 2.5, EY - 4 * sy, 2.8, 0, Math.PI * 2);
            g.fill();
            g.beginPath();
            g.arc(x - 2.5, EY + 4 * sy, 1.3, 0, Math.PI * 2);
            g.fill();
        });
    };
    if (kind === "normal" || kind === "blink") {
        // 정면을 보며 귀 기울이는 얼굴 (보내 주신 그림의 눈·볼·입)
        blush(1);
        ln(2.6, BROW);
        [[L, 1], [R, -1]].forEach(([x, s]) => { g.beginPath(); g.moveTo(x - 10, 186); g.quadraticCurveTo(x, 181, x + 10, 186); g.stroke(); });
        if (kind === "normal") {
            [L, R].forEach((x) => {
                g.beginPath(); g.ellipse(x, EY, 6.8, 9.2, 0, 0, Math.PI * 2); g.fillStyle = EYE; g.fill();
                g.fillStyle = "#fff";
                g.beginPath(); g.arc(x + 2.4, EY - 3.6, 2.7, 0, Math.PI * 2); g.fill();
                g.beginPath(); g.arc(x - 2, EY + 4, 1.2, 0, Math.PI * 2); g.fill();
            });
        }
        else {
            ln(3, EYE);
            [L, R].forEach((x) => { g.beginPath(); g.moveTo(x - 8, EY + 2); g.quadraticCurveTo(x, EY + 5, x + 8, EY + 2); g.stroke(); });
        }
        ln(2.4, MOUTH);
        g.beginPath();
        g.moveTo(173, 238);
        g.quadraticCurveTo(178, 237.5, 183, 238);
        g.stroke();
    }
    else if (kind === "shock") {
        blush(0.6);
        brows(-6, -2);
        [L, R].forEach((x) => {
            g.beginPath();
            g.ellipse(x, EY, 11, 13, 0, 0, Math.PI * 2);
            g.fillStyle = "#fff";
            g.fill();
            ln(2.6, EYE);
            g.stroke();
            g.beginPath();
            g.arc(x, EY + 1, 3.6, 0, Math.PI * 2);
            g.fillStyle = EYE;
            g.fill();
        });
        g.beginPath();
        g.ellipse(178, 240, 7, 9.5, 0, 0, Math.PI * 2);
        g.fillStyle = "#7d3a40";
        g.fill();
        ln(2.2, "#4a2228");
        g.stroke();
        g.beginPath();
        g.ellipse(178, 244, 4, 3, 0, 0, Math.PI * 2);
        g.fillStyle = "#e07b80";
        g.fill();
        // 깜짝 줄무늬
        ln(1.8, "rgba(90,70,120,0.6)");
        [130, 136, 142].forEach((x, i) => { g.beginPath(); g.moveTo(x, 168 + i * 2); g.lineTo(x, 178 + i * 2); g.stroke(); });
    }
    else if (kind === "dizzy") {
        blush(0.8);
        brows(-2, -3);
        ln(2.4, EYE);
        [L, R].forEach((x, k) => {
            g.beginPath();
            for (let i = 0; i <= 60; i++) {
                const a = i * 0.32 * (k ? -1 : 1), r = 1 + i * 0.17;
                g.lineTo(x + Math.cos(a) * r, EY + Math.sin(a) * r);
            }
            g.stroke();
        });
        ln(2.6, MOUTH);
        g.beginPath();
        g.moveTo(166, 240);
        for (let i = 1; i <= 4; i++)
            g.quadraticCurveTo(166 + i * 6 - 3, 240 + (i % 2 ? -4 : 4), 166 + i * 6, 240);
        g.stroke();
    }
    else if (kind === "teary") {
        // 볼 빵빵 + 그렁그렁
        blush(1.35);
        ln(3.2, BROW);
        [[L, 1], [R, -1]].forEach(([x, s]) => { g.beginPath(); g.moveTo(x - 10, 184 + 5 * s * -1 * -1); g.lineTo(x + 10, 184 - 5 * s); g.stroke(); });
        [L, R].forEach((x) => {
            g.beginPath();
            g.ellipse(x, EY, 9, 11, 0, 0, Math.PI * 2);
            g.fillStyle = EYE;
            g.fill();
            g.save();
            g.beginPath();
            g.ellipse(x, EY, 9, 11, 0, 0, Math.PI * 2);
            g.clip();
            g.fillStyle = "rgba(120,190,255,0.75)";
            g.fillRect(x - 10, EY + 3, 20, 10);
            g.restore();
            g.fillStyle = "#fff";
            g.beginPath();
            g.arc(x + 3, EY - 4, 3.4, 0, Math.PI * 2);
            g.fill();
            g.beginPath();
            g.arc(x - 3, EY + 1, 1.8, 0, Math.PI * 2);
            g.fill();
            g.beginPath();
            g.arc(x + 2, EY + 6, 1.4, 0, Math.PI * 2);
            g.fill();
        });
        // 눈물 줄기
        ln(3.4, "rgba(140,200,255,0.85)");
        [L - 4, R + 4].forEach((x) => { g.beginPath(); g.moveTo(x, EY + 11); g.quadraticCurveTo(x - 1, EY + 24, x + 1, EY + 34); g.stroke(); });
        // 삐죽 입
