<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>마법 투구 착용</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
  :root {
    --stage: #DEE1F2;
    --navy: #1F3566;
    --navy-ink: #14244A;
    --gold: #E6B23E;
    --gold-soft: #F6DE93;
    --text: #1F3566;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --text: #1F3566; }
  }
  :root[data-theme="dark"] { --text: #1F3566; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
  *, *::before, *::after { box-sizing: inherit; }
  body {
    margin: 0; height: 100%; overflow: hidden;
    background: var(--stage); color: var(--text);
    font-family: "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
  }
  #root, .app { height: 100%; }
  .app { position: relative; }
  canvas { display: block; width: 100%; height: 100%; }
  .bar {
    position: absolute; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px));
    transform: translateX(-50%);
    display: flex; gap: 10px; align-items: center;
  }
  button {
    font: inherit; cursor: pointer; border: 0;
    transition: transform .15s ease, background-color .15s ease, opacity .15s ease;
  }
  button:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
  .play {
    background: var(--navy); color: var(--gold-soft);
    font-size: 1.05rem; padding: 12px 26px; border-radius: 999px;
    box-shadow: 0 6px 0 var(--navy-ink);
    min-width: 132px;
  }
  .play:hover:not(:disabled) { transform: translateY(-1px); }
  .play:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 2px 0 var(--navy-ink); }
  .play:disabled { opacity: .55; cursor: default; }
  .sound {
    background: transparent; color: var(--navy);
    font-size: .95rem; padding: 10px 14px; border-radius: 999px;
    border: 2px solid rgba(31,53,102,.35);
  }
  .sound[aria-pressed="false"] { opacity: .6; }
  .loading {
    position: absolute; inset: 0; display: grid; place-items: center;
    font-size: 1rem; color: var(--navy);
  }
</style>
</head>

  // ─── 이미지 좌표계 (두 번째 사진 기준 752×1024) ───────────────────────────
  const IMG_W = 752, IMG_H = 1024;
  const STAGE_COLOR = 0xDEE1F2;
  const EARS = [[218, 432], [572, 440]];            // 양 귀 위치
  const [HX, HY, HW, HH] = ASSETS.hbox;             // 투구 스프라이트 영역
  const TWINKLE_SPOTS = [[482, 302], [237, 344], [112, 160], [732, 640], [262, 190]];
  const toWorld = (x, y) => new THREE.Vector2(x - IMG_W / 2, IMG_H / 2 - y);

  // ─── 타임라인 (초) ────────────────────────────────────────────────────────
  const T = {
    ringStart: 0.15, ringGap: 0.22, ringCount: 4, ringLife: 1.45,
    flyStart: 1.35, flyDur: 1.15,
    get land() { return this.flyStart + this.flyDur; },
    fadeDur: 0.32, glintDelay: 0.45, glintDur: 0.8,
    end: 4.4
  };

  const clamp01 = (v) => Math.min(1, Math.max(0, v));
  const easeOutCubic = (t) => 1 - Math.pow(1 - t, 3);
  const easeInCubic = (t) => t * t * t;
  const easeOutBack = (t, s = 1.25) => 1 + (s + 1) * Math.pow(t - 1, 3) + s * Math.pow(t - 1, 2);

  // ─── 사운드 (Web Audio로 합성한 벨) ────────────────────────────────────────
  function createAudio() {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return null;
    const ctx = new Ctx();
    const master = ctx.createGain(); master.gain.value = 0.55;
    const delay = ctx.createDelay(); delay.delayTime.value = 0.19;
    const fb = ctx.createGain(); fb.gain.value = 0.32;
    const wet = ctx.createGain(); wet.gain.value = 0.35;
    master.connect(ctx.destination);
    master.connect(delay); delay.connect(fb); fb.connect(delay); delay.connect(wet); wet.connect(ctx.destination);

    function bell(t, f, gain = 0.22, dur = 2.4) {
      const out = ctx.createGain(); out.gain.value = gain; out.connect(master);
      // 벨 특유의 비정수배 배음
      [[1, 1, 1], [2.0, 0.45, 0.55], [2.76, 0.32, 0.42], [5.4, 0.16, 0.25], [8.93, 0.07, 0.14]]
        .forEach(([m, a, d]) => {
          const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.value = f * m;
          const g = ctx.createGain();
          g.gain.setValueAtTime(0.0001, t);
          g.gain.exponentialRampToValueAtTime(a, t + 0.004);
          g.gain.exponentialRampToValueAtTime(0.0001, t + dur * d);
          o.connect(g); g.connect(out); o.start(t); o.stop(t + dur * d + 0.05);
        });
    }
    function whoosh(t, dur) {
      const len = Math.floor(ctx.sampleRate * dur);
      const buf = ctx.createBuffer(1, len, ctx.sampleRate);
      const data = buf.getChannelData(0);
      for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
      const src = ctx.createBufferSource(); src.buffer = buf;
      const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 1.4;
      bp.frequency.setValueAtTime(500, t); bp.frequency.exponentialRampToValueAtTime(2600, t + dur);
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.12, t + dur * 0.8);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      src.connect(bp); bp.connect(g); g.connect(master); src.start(t); src.stop(t + dur);
    }
    function thunk(t) {
      const o = ctx.createOscillator(); o.type = 'triangle';
      o.frequency.setValueAtTime(260, t); o.frequency.exponentialRampToValueAtTime(90, t + 0.18);
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.35, t + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.25);
      o.connect(g); g.connect(master); o.start(t); o.stop(t + 0.3);
    }
    return {
      ctx,
      schedule() {
        const now = ctx.currentTime + 0.03;
        // 귀에서 퍼지는 청량한 벨
        bell(now + T.ringStart, 1318.5, 0.24);
        bell(now + T.ringStart + T.ringGap, 1975.5, 0.14, 2.0);
        bell(now + T.ringStart + T.ringGap * 2, 1318.5, 0.08, 1.6);
        // 투구 비행
        whoosh(now + T.flyStart, T.flyDur);
        // 착지 + 반짝임
        thunk(now + T.land);
        [1568, 1976, 2349, 2637, 3136, 3951].forEach((f, i) =>
          bell(now + T.land + 0.04 + i * 0.055, f, 0.1 - i * 0.01, 1.6));
      }
    };
  }

  // ─── 셰이더 ────────────────────────────────────────────────────────────
  const ringVert = `varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`;
  const ringFrag = `
    uniform float uP; uniform float uSeed; varying vec2 vUv;
    void main(){
      vec2 p=(vUv-0.5)*2.0; float r=length(p); float a=atan(p.y,p.x);
      float rad = uP*0.94 + 0.018*sin(a*9.0+uSeed+uP*14.0)*uP;
      float w = mix(0.045,0.012,uP);
      float d = abs(r-rad);
      float core = smoothstep(w,0.0,d);
      float glow = smoothstep(w*5.0,0.0,d)*0.4;
      float ticks = 0.8+0.2*step(0.5,fract(a*18.0/6.2831853+uSeed));
      float fade = pow(1.0-uP,1.6)*smoothstep(0.0,0.06,uP);
      vec3 gold = mix(vec3(0.86,0.58,0.10), vec3(1.0,0.92,0.55), core);
      gl_FragColor = vec4(gold, clamp((core*ticks+glow)*fade,0.0,1.0));
    }`;
  const helmetFrag = `
    uniform sampler2D map; uniform float uGlint; uniform float uOpacity; uniform float uGlow; varying vec2 vUv;
    void main(){
      vec4 t=texture2D(map,vUv);
      float band=(vUv.x*0.8+vUv.y*0.6)-uGlint;
      float g=smoothstep(0.09,0.0,abs(band));
      vec3 col=t.rgb+vec3(1.0,0.96,0.8)*g*0.6*t.a+vec3(1.0,0.85,0.4)*uGlow*t.a;
      gl_FragColor=vec4(col,t.a*uOpacity);
    }`;
  const flashFrag = `
    uniform float uA; varying vec2 vUv;
    void main(){
      vec2 p=(vUv-0.5)*2.0; float r=length(p); float a=atan(p.y,p.x);
      float rays=pow(max(0.0,cos(a*8.0)),18.0)*smoothstep(1.0,0.1,r)*0.6;
      float disc=smoothstep(1.0,0.0,r); disc*=disc;
      vec3 c=mix(vec3(1.0,0.82,0.35),vec3(1.0,1.0,0.94),disc);
      gl_FragColor=vec4(c,(disc*0.85+rays)*uA);
    }`;
  const starVert = `
    attribute float aSize; attribute float aAlpha; attribute float aRot; uniform float uScale;
    varying float vA; varying float vRot;
    void main(){ vA=aAlpha; vRot=aRot; gl_PointSize=aSize*uScale; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`;
  const starFrag = `
    varying float vA; varying float vRot;
    void main(){
      vec2 p=gl_PointCoord*2.0-1.0; float c=cos(vRot), s=sin(vRot); p=mat2(c,-s,s,c)*p;
      float ax=abs(p.x), ay=abs(p.y); float r=length(p);
      float arms=clamp(1.0-(ax*ay*28.0+r*0.95),0.0,1.0);
      float core=smoothstep(0.32,0.0,r);
      float halo=smoothstep(1.0,0.0,r)*0.25;
      vec3 col=mix(vec3(0.98,0.72,0.18),vec3(1.0,1.0,0.95),core+arms*0.4);
      float a=clamp(arms+core+halo,0.0,1.0)*vA;
      if(a<0.01) discard;
      gl_FragColor=vec4(col,a);
    }`;

  // ─── three.js 스테이지 ──────────────────────────────────────────────────
  function createStage(canvas, { onReady, onDone }) {
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
    renderer.setClearColor(STAGE_COLOR, 1);
    const scene = new THREE.Scene();
    const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, -10, 10);
    let zoom = 1;

    const loader = new THREE.TextureLoader();
    const load = (src) => new Promise((res) => loader.load(src, (t) => {
      t.minFilter = THREE.LinearFilter; t.generateMipmaps = false; res(t);
    }));

    let disposed = false, raf = 0, startAt = null, doneFired = true;
    const objs = {};

    // 반짝이 파티클 풀 (CPU 업데이트)
    const MAX = 260;
    const pPos = new Float32Array(MAX * 3), pSize = new Float32Array(MAX),
          pAlpha = new Float32Array(MAX), pRot = new Float32Array(MAX);
    const parts = Array.from({ length: MAX }, () => ({ alive: false }));
    const pGeo = new THREE.BufferGeometry();
    pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
    pGeo.setAttribute('aSize', new THREE.BufferAttribute(pSize, 1));
    pGeo.setAttribute('aAlpha', new THREE.BufferAttribute(pAlpha, 1));
    pGeo.setAttribute('aRot', new THREE.BufferAttribute(pRot, 1));
    const pMat = new THREE.ShaderMaterial({
      vertexShader: starVert, fragmentShader: starFrag, transparent: true, depthTest: false,
      uniforms: { uScale: { value: 1 } }
    });
    const points = new THREE.Points(pGeo, pMat); points.frustumCulled = false; points.renderOrder = 10;
    scene.add(points);
    let cursor = 0;
    function emit(x, y, vx, vy, life, size, spin = 0, grav = -260) {
      const p = parts[cursor]; cursor = (cursor + 1) % MAX;
      Object.assign(p, { alive: true, x, y, vx, vy, age: 0, life, size, rot: Math.random() * 3.14, spin, grav });
    }
    function burst(cx, cy, n, speed) {
      for (let i = 0; i < n; i++) {
        const a = Math.random() * Math.PI * 2, s = speed * (0.35 + Math.random() * 0.75);
        emit(cx + Math.cos(a) * 30, cy + Math.sin(a) * 30, Math.cos(a) * s, Math.sin(a) * s + 80,
             0.7 + Math.random() * 0.7, 18 + Math.random() * 34, (Math.random() - 0.5) * 4);
      }
    }

    Promise.all([load(ASSETS.base1), load(ASSETS.base2), load(ASSETS.helmet)]).then(([t1, t2, th]) => {
      if (disposed) return;
      const plane = new THREE.PlaneGeometry(IMG_W, IMG_H);
      objs.base1 = new THREE.Mesh(plane, new THREE.MeshBasicMaterial({ map: t1, transparent: true, depthTest: false }));
      objs.base2 = new THREE.Mesh(plane, new THREE.MeshBasicMaterial({ map: t2, transparent: true, opacity: 0, depthTest: false }));
      objs.base1.renderOrder = 0; objs.base2.renderOrder = 1;
      scene.add(objs.base1, objs.base2);

      // 음파 링: 귀마다 여러 겹
      objs.rings = [];
      const R = 470;
      EARS.forEach(([ex, ey], ei) => {
        const w = toWorld(ex, ey);
        for (let i = 0; i < T.ringCount; i++) {
          const m = new THREE.Mesh(new THREE.PlaneGeometry(R * 2, R * 2), new THREE.ShaderMaterial({
            vertexShader: ringVert, fragmentShader: ringFrag, transparent: true, depthTest: false,
            uniforms: { uP: { value: 0 }, uSeed: { value: ei * 2.1 + i * 1.3 } }
          }));
          m.position.set(w.x, w.y, 0); m.renderOrder = 3; m.visible = false;
          m.userData.delay = T.ringStart + i * T.ringGap + ei * 0.04;
          objs.rings.push(m); scene.add(m);
        }
      });

      // 투구: 아래쪽 중앙을 피벗으로 (착지 시 눌림 효과)
      const hg = new THREE.PlaneGeometry(HW, HH); hg.translate(0, HH / 2, 0);
      objs.helmetMat = new THREE.ShaderMaterial({
        vertexShader: ringVert, fragmentShader: helmetFrag, transparent: true, depthTest: false,
        uniforms: { map: { value: th }, uGlint: { value: -1 }, uOpacity: { value: 1 }, uGlow: { value: 0 } }
      });
      objs.helmet = new THREE.Mesh(hg, objs.helmetMat); objs.helmet.renderOrder = 5;
      const pivot = toWorld(HX + HW / 2, HY + HH);
      objs.helmetHome = pivot;
      objs.helmet.visible = false;
      scene.add(objs.helmet);

      // 착지 섬광
      objs.flash = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.ShaderMaterial({
        vertexShader: ringVert, fragmentShader: flashFrag, transparent: true, depthTest: false,
        uniforms: { uA: { value: 0 } }
      }));
      const fc = toWorld(372, 330); objs.flash.position.set(fc.x, fc.y, 0);
      objs.flash.renderOrder = 8; objs.flash.visible = false; scene.add(objs.flash);

      resize();
      onReady && onReady();
      raf = requestAnimationFrame(tick);
    });

    function resize() {
      const w = canvas.clientWidth, hgt = canvas.clientHeight;
      if (!w || !hgt) return;
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.setSize(w, hgt, false);
      const bottomUI = 70; // 하단 버튼 공간
      zoom = Math.min(w / (IMG_W * 1.02), (hgt - bottomUI * 0.5) / (IMG_H * 1.02));
      const halfW = w / 2 / zoom, halfH = hgt / 2 / zoom;
      const shift = (bottomUI * 0.25) / zoom;
      camera.left = -halfW; camera.right = halfW;
      camera.top = halfH - shift; camera.bottom = -halfH - shift;
      camera.updateProjectionMatrix();
      pMat.uniforms.uScale.value = zoom * renderer.getPixelRatio();
    }
    window.addEventListener('resize', resize);

    function reset() {
      if (!objs.base1) return;
      objs.base1.material.opacity = 1; objs.base2.material.opacity = 0;
      objs.helmet.visible = false; objs.flash.visible = false;
      objs.rings.forEach((r) => (r.visible = false));
      objs.helmetMat.uniforms.uGlint.value = -1; objs.helmetMat.uniforms.uGlow.value = 0;
      parts.forEach((p) => (p.alive = false));
    }

    let last = performance.now();
    let twinkleClock = 0;
    function tick(now) {
      if (disposed) return;
      const dt = Math.min(0.05, (now - last) / 1000); last = now;
      if (objs.base1 && startAt !== null) {
        const t = (now - startAt) / 1000;
        update(t, dt);
        if (!doneFired && t > T.end) { doneFired = true; onDone && onDone(); }
      }
      stepParticles(dt);
      renderer.render(scene, camera);
      raf = requestAnimationFrame(tick);
    }

    function update(t, dt) {
      // 1) 황금 음파 링
      objs.rings.forEach((r) => {
        const u = (t - r.userData.delay) / T.ringLife;
        r.visible = u > 0 && u < 1;
        if (r.visible) r.material.uniforms.uP.value = easeOutCubic(clamp01(u));
      });
      // 귀 주변 작은 음표 반짝이
      if (t > T.ringStart && t < T.ringStart + T.ringGap * T.ringCount && Math.random() < 0.5) {
        const [ex, ey] = EARS[Math.random() < 0.5 ? 0 : 1]; const w = toWorld(ex, ey);
        const a = Math.random() * Math.PI * 2;
        emit(w.x, w.y, Math.cos(a) * 220, Math.sin(a) * 220, 0.6, 12 + Math.random() * 10, 2, 0);
      }

      // 2) 투구 비행 → 착지
      const H = objs.helmet, home = objs.helmetHome;
      const fu = (t - T.flyStart) / T.flyDur;
      if (fu < 0) { H.visible = false; }
      else {
        H.visible = true;
        const u = clamp01(fu);
        const ey = easeOutBack(u, 1.15);
        const ex = easeOutCubic(u);
        const arc = Math.sin(Math.PI * u) * -140;
        H.position.set(home.x + 190 * (1 - ex) + arc, home.y + 980 * (1 - ey), 0);
        const wobble = Math.sin(u * 14) * 0.12 * (1 - u);
        H.rotation.z = 0.55 * (1 - easeOutCubic(u)) + wobble;
        let sx = 0.72 + 0.28 * easeOutCubic(u), sy = sx;
        // 착지 순간 살짝 눌렸다 복원
        const lu = (t - T.land) / 0.28;
        if (lu > 0 && lu < 1) { const k = Math.sin(Math.PI * lu) * 0.06; sx = 1 + k; sy = 1 - k; }
        H.scale.set(sx, sy, 1);
        // 비행 중 꼬리 반짝이
        if (u < 1 && Math.random() < 0.8) {
          emit(H.position.x + (Math.random() - 0.5) * HW * 0.6, H.position.y + HH * (0.2 + Math.random() * 0.6),
               (Math.random() - 0.5) * 60, 60 + Math.random() * 80, 0.5 + Math.random() * 0.4, 12 + Math.random() * 16, 3, -40);
        }
      }

      // 3) 착지: 섬광, 폭발 반짝이, 두 번째 사진으로 전환
      const lt = t - T.land;
      if (lt >= 0 && !objs.bursted) {
        objs.bursted = true;
        const c = toWorld(372, 300);
        burst(c.x, c.y, 70, 520);
        burst(c.x, c.y + 120, 30, 320);
      }
      const fl = lt / 0.55;
      objs.flash.visible = fl > 0 && fl < 1;
      if (objs.flash.visible) {
        const s = 260 + 520 * easeOutCubic(fl);
        objs.flash.scale.set(s, s, 1);
        objs.flash.material.uniforms.uA.value = Math.sin(Math.PI * Math.min(1, fl * 1.6)) * (1 - fl) * 0.95;
      }
      const cf = clamp01((lt - 0.04) / T.fadeDur);
      objs.base2.material.opacity = cf;
      objs.base1.material.opacity = 1 - clamp01((lt - 0.04 - T.fadeDur * 0.6) / (T.fadeDur * 0.6));
      objs.helmetMat.uniforms.uGlow.value = lt > 0 ? Math.max(0, 0.45 * (1 - lt / 0.5)) : 0;

      // 4) 투구 위를 지나가는 빛줄기 + 지속 반짝임
      const gu = (lt - T.glintDelay) / T.glintDur;
      if (gu > 0) {
        const cyc = gu % 4.2; // 이후 주기적으로 반복
        objs.helmetMat.uniforms.uGlint.value = cyc < 1 ? -0.2 + 1.8 * cyc : -1;
      }
      if (lt > 0.3) {
        twinkleClock += dt;
        if (twinkleClock > 0.34) {
          twinkleClock = 0;
          const [sx0, sy0] = TWINKLE_SPOTS[Math.floor(Math.random() * TWINKLE_SPOTS.length)];
          const w = toWorld(sx0 + (Math.random() - 0.5) * 16, sy0 + (Math.random() - 0.5) * 16);
          emit(w.x, w.y, 0, 0, 0.9, 30 + Math.random() * 18, 1.5, 0);
        }
      }
    }

    function stepParticles(dt) {
      for (let i = 0; i < MAX; i++) {
        const p = parts[i];
        if (!p.alive) { pAlpha[i] = 0; pSize[i] = 0; continue; }
        p.age += dt;
        if (p.age >= p.life) { p.alive = false; pAlpha[i] = 0; continue; }
        p.vx *= 0.96; p.vy = p.vy * 0.96 + p.grav * dt;
        p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.spin * dt;
        const k = p.age / p.life;
        pPos[i * 3] = p.x; pPos[i * 3 + 1] = p.y; pPos[i * 3 + 2] = 0;
        pAlpha[i] = Math.sin(Math.PI * Math.min(1, k * 1.15));
        pSize[i] = p.size * (0.6 + 0.4 * Math.sin(Math.PI * k));
        pRot[i] = p.rot;
      }
      pGeo.attributes.position.needsUpdate = true;
      pGeo.attributes.aSize.needsUpdate = true;
      pGeo.attributes.aAlpha.needsUpdate = true;
      pGeo.attributes.aRot.needsUpdate = true;
    }

    return {
      play() { reset(); objs.bursted = false; doneFired = false; startAt = performance.now(); },
      resize,
      dispose() {
        disposed = true; cancelAnimationFrame(raf);
        window.removeEventListener('resize', resize); renderer.dispose();
      }
    };
  }

  // ─── React UI ───────────────────────────────────────────────────────────
  function App() {
    const canvasRef = useRef(null);
    const stageRef = useRef(null);
    const audioRef = useRef(null);
    const [ready, setReady] = useState(false);
    const [phase, setPhase] = useState('idle'); // idle | playing | done
    const [sound, setSound] = useState(true);

    useEffect(() => {
      const stage = createStage(canvasRef.current, {
        onReady: () => setReady(true),
        onDone: () => setPhase('done')
      });
      stageRef.current = stage;
      return () => stage.dispose();
    }, []);

    const play = useCallback(() => {
      if (!stageRef.current) return;
      if (sound) {
        if (!audioRef.current) audioRef.current = createAudio();
        const a = audioRef.current;
        if (a) { if (a.ctx.state === 'suspended') a.ctx.resume(); a.schedule(); }
      }
      stageRef.current.play();
      setPhase('playing');
    }, [sound]);

    const label = phase === 'idle' ? '재생' : phase === 'playing' ? '재생 중…' : '다시 보기';

    return h('div', { className: 'app' },
      h('canvas', { ref: canvasRef, 'aria-label': '파란 마법사에게 마법 투구가 씌워지는 애니메이션' }),
      !ready && h('div', { className: 'loading' }, '불러오는 중…'),
      h('div', { className: 'bar' },
        h('button', { className: 'play', onClick: play, disabled: !ready || phase === 'playing' }, label),
        h('button', {
          className: 'sound', 'aria-pressed': String(sound),
          onClick: () => setSound((s) => !s)
        }, sound ? '소리 켜짐' : '소리 꺼짐')
      )
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(h(App));
})();
</script>
</body>
</html>
