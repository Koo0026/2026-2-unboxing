<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>초록 망토의 수호 마법</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root {
  --stage: #DBE1F1;
  --green: #1F5A3A;
  --green-ink: #123624;
  --gold-soft: #F4DE9A;
  --mint: #BFF3DA;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --stage: #DBE1F1; } }
:root[data-theme="dark"] { --stage: #DBE1F1; }
html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
*, *::before, *::after { box-sizing: inherit; }
body {
  margin: 0; height: 100%; overflow: hidden; background: var(--stage); color: var(--green);
  font-family: "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
}
#root, .app { height: 100%; }
.app { position: relative; }
canvas { display: block; width: 100%; height: 100%; }
.bar {
  position: absolute; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%); display: flex; gap: 10px; align-items: center;
}
button { font: inherit; cursor: pointer; border: 0; transition: transform .15s ease, opacity .15s ease; }
button:focus-visible { outline: 3px solid var(--mint); outline-offset: 3px; }
.play {
  background: var(--green); color: var(--gold-soft); font-size: 1.05rem;
  padding: 12px 26px; border-radius: 999px; box-shadow: 0 6px 0 var(--green-ink); min-width: 132px;
}
.play:hover:not(:disabled) { transform: translateY(-1px); }
.play:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 2px 0 var(--green-ink); }
.play:disabled { opacity: .55; cursor: default; }
.sound {
  background: rgba(255,255,255,.75); color: var(--green); font-size: .95rem;
  padding: 10px 14px; border-radius: 999px; border: 2px solid rgba(31,90,58,.35);
}
.sound[aria-pressed="false"] { opacity: .65; }
.loading { position: absolute; inset: 0; display: grid; place-items: center; font-size: 1rem; }
</style>
</head>

// ─── 사운드: Web Audio 합성 ────────────────────────────────────────────────
function createAudio() {

      const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.value = f * m;

    lp.frequency.setValueAtTime(260, t0);
    lp.frequency.exponentialRampToValueAtTime(2000, t0 + 1.8);
    lp.frequency.exponentialRampToValueAtTime(900, t0 + dur);

    g.gain.setValueAtTime(0.0001, t0);

    bp.frequency.setValueAtTime(f0, t0); bp.frequency.exponentialRampToValueAtTime(f1, t0 + dur);

    ctx,
    schedule() {

      pad(n, T.end + 0.6);
      // 마법진이 그려지는 동안 올라가는 종소리
      [587.33, 659.25, 739.99, 880, 1108.73, 1174.66].forEach((f, i) => bell(n + T.circle[0] + i * 0.24, f, 0.08, 2.4));

      noiseSweep(n + T.threadStart, T.threadDur + 0.5, 1800, 7000, 9, 0.06);
      // 망토 비행: 휘익 + 펄럭임
      noiseSweep(n + T.fly[0], T.fly[1] - T.fly[0], 300, 1400, 1.2, 0.1);
      [0.25, 0.55, 0.82, 1.05].forEach((d) => flap(n + T.fly[0] + d, 0.2));
      flap(n + T.fly[1], 0.35);
      [1174.66, 1479.98, 1760].forEach((f, i) => bell(n + T.fly[1] + 0.03 + i * 0.07, f, 0.07, 1.8));

      hum(n + T.shield[0], T.end - T.shield[0] + 0.6);
      bell(n + T.shield[0] + 0.05, 880, 0.08, 3);
      bell(n + T.shield[0] + 0.05, 1318.5, 0.05, 3);
    }

}

const uvVert = `varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`;

const circleFrag = `

    float c=cos(uRot), s=sin(uRot);

const floorGlowFrag = `

const threadVert = `
  attribute float aS; attribute float aSide; attribute float aDepth;
  varying float vS; varying float vSide; varying float vDepth;
  void main(){ vS=aS; vSide=aSide; vDepth=aDepth; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`;
const threadFrag = `
  uniform float uHead; uniform float uLen; uniform float uFront; uniform vec3 uColor; uniform float uFade;
  varying float vS; varying float vSide; varying float vDepth;

// ─── 스테이지 ─────────────────────────────────────────────────────────────
function createStage(canvas, { onReady, onDone } = {}) {
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });

  if (THREE.ColorManagement) THREE.ColorManagement.enabled = false;

  const bgColor = new THREE.Color().setRGB(...BG_LIGHT);
  renderer.setClearColor(bgColor, 1);

  const scene = new THREE.Scene();
  const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, -2000, 2000);
  const clock = { start: null };
  let disposed = false, raf = 0, doneFired = true, zoom = 1, bursted = false;
  const o = {};

  const loader = new THREE.TextureLoader();

  // ── 반짝이 파티클 ──
  const MAX = 400;
  const pPos = new Float32Array(MAX * 3), pSize = new Float32Array(MAX), pAlpha = new Float32Array(MAX),
        pRot = new Float32Array(MAX), pCol = new Float32Array(MAX * 3);
  const parts = Array.from({ length: MAX }, () => ({ alive: false }));
  const pGeo = new THREE.BufferGeometry();
  pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
  pGeo.setAttribute('aSize', new THREE.BufferAttribute(pSize, 1));
  pGeo.setAttribute('aAlpha', new THREE.BufferAttribute(pAlpha, 1));
  pGeo.setAttribute('aRot', new THREE.BufferAttribute(pRot, 1));
  pGeo.setAttribute('aColor', new THREE.BufferAttribute(pCol, 3));

  function emit(x, y, vx, vy, life, size, color, grav = -120) {

      rot: Math.random() * 3.14, spin: (Math.random() - 0.5) * 4 });
  }

  // ── 실타래 기하 ──
  function threadPoint(phase, s) {
    const th = phase + s * THREAD_TURNS * Math.PI * 2;
    const R = lerp(300, 190, s) * (1 + 0.06 * Math.sin(s * 23 + phase));
    const y = lerp(THREAD_Y0, THREAD_Y1, s);
    const w = toWorld(AXIS_X + R * Math.cos(th), y - R * Math.sin(th) * 0.26);

  }
  function threadGeometry(phase) {

    const pos = new Float32Array(N * 6), aS = new Float32Array(N * 2), aSide = new Float32Array(N * 2), aDepth = new Float32Array(N * 2);
    const idx = [];
    for (let i = 0; i < N; i++) {
      const a = pts[Math.max(0, i - 1)], b = pts[Math.min(N - 1, i + 1)];
      let tx = b.x - a.x, ty = b.y - a.y; const l = Math.hypot(tx, ty) || 1; tx /= l; ty /= l;

  Promise.all([load(ASSETS.circle), load(ASSETS.base2), load(ASSETS.base3), load(ASSETS.cape)]).then(([tc, t2, t3, tcape]) => {
    if (disposed) return;
    const feet = toWorld(...FEET);

    // 바닥 발광 + 마법진 (캐릭터 뒤)
    o.floorGlow = new THREE.Mesh(new THREE.PlaneGeometry(CIRCLE_R * 2.8, CIRCLE_R * 2.8), shader(uvVert, floorGlowFrag, { uA: { value: 0 } }));
    o.floorGlow.position.set(feet.x, feet.y, 0); o.floorGlow.scale.y = CIRCLE_SQUASH; o.floorGlow.renderOrder = 1;
    o.circle = new THREE.Mesh(new THREE.PlaneGeometry(CIRCLE_R * 2, CIRCLE_R * 2), shader(uvVert, circleFrag, {
      map: { value: tc }, uP: { value: 0 }, uRot: { value: 0 }, uGlow: { value: 0 }, uAlpha: { value: 1 } }));
    o.circle.position.set(feet.x, feet.y, 0); o.circle.scale.y = CIRCLE_SQUASH; o.circle.renderOrder = 2;

    o.base2 = new THREE.Mesh(new THREE.PlaneGeometry(ASSETS.base2Box[2], ASSETS.base2Box[3]), basic(t2));

      const back = new THREE.Mesh(g, shader(threadVert, threadFrag, { ...uniforms, uFront: { value: 0 } }, { side: THREE.DoubleSide }));
      const front = new THREE.Mesh(g, shader(threadVert, threadFrag, { ...uniforms, uFront: { value: 1 } }, { side: THREE.DoubleSide }));

    const [cx, cy, cw, ch] = ASSETS.capeBox;
    const cg = new THREE.PlaneGeometry(cw, ch, 36, 36); cg.translate(0, -ch / 2, 0);

    o.cape = new THREE.Mesh(cg, o.capeMat); o.cape.renderOrder = 10; o.cape.visible = false; o.cape.frustumCulled = false;

    scene.add(o.cape);

    o.shieldMat = shader(shieldVert, shieldFrag, { uA: { value: 0 }, uTime: { value: 0 }, uFlash: { value: 0 } });

    scene.add(o.shield);

    resize();

    raf = requestAnimationFrame(tick);
  });

  function resize() {
    const w = canvas.clientWidth, h = canvas.clientHeight;
    if (!w || !h) return;
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(w, h, false);
    const ui = 70;
    zoom = Math.min(w / (IMG_W * 1.06), (h - ui * 0.5) / (IMG_H * 1.08));

    o.cape.visible = false; o.shield.visible = false;
    parts.forEach((p) => (p.alive = false));

    // 0) 배경 밝기
    const dim = easeInOutCubic(range(t, T.dimIn)) * (1 - easeInOutCubic(range(t, T.dimOut)));
    bgColor.setRGB(lerp(BG_LIGHT[0], BG_DARK[0], dim), lerp(BG_LIGHT[1], BG_DARK[1], dim), lerp(BG_LIGHT[2], BG_DARK[2], dim));
    renderer.setClearColor(bgColor, 1);

    // 1) 마법진이 바닥에 그려짐
    const cu = o.circle.material.uniforms;
    cu.uP.value = easeInOutCubic(range(t, T.circle));
    cu.uRot.value = t * 0.12;
    const drawnPulse = Math.exp(-Math.pow((t - T.circle[1]) * 3, 2));
    const landPulse = Math.exp(-Math.pow((t - T.fly[1]) * 4, 2));
    cu.uGlow.value = 0.25 * dim + 0.6 * drawnPulse + 0.5 * landPulse;
    cu.uAlpha.value = lerp(0.45, 1, dim);
    o.floorGlow.material.uniforms.uA.value = (0.55 * dim + 0.3 * drawnPulse) * clamp01(cu.uP.value * 2);
    const feet = toWorld(...FEET);
    if (t > T.circle[0] && t < T.dimOut[1] && Math.random() < 0.35 * Math.max(dim, 0.2)) {
      const a = Math.random() * Math.PI * 2, r = CIRCLE_R * (0.4 + Math.random() * 0.6);
      emit(feet.x + Math.cos(a) * r, feet.y + Math.sin(a) * r * CIRCLE_SQUASH, 0, 90 + Math.random() * 90,
           1.1 + Math.random() * 0.8, 10 + Math.random() * 12, PALETTE.violet, 20);
    }

    // 2) 빛의 실타래가 몸을 휘감음
    o.threads.forEach((th, k) => {
      const u = (t - T.threadStart - k * T.threadStagger) / T.threadDur;
      const head = easeInOutCubic(clamp01(u)) * (1 + T.threadLen);
      th.uniforms.uHead.value = u <= 0 ? -1 : head;
      th.uniforms.uFade.value = 1 - clamp01((head - 1) / T.threadLen) * 0.6;
      if (u > 0 && head < 1 && Math.random() < 0.9) {
        const p = threadPoint(th.phase, head);
        if (p.depth < 0.2) emit(p.x, p.y, (Math.random() - 0.5) * 80, (Math.random() - 0.5) * 80, 0.6, 12 + Math.random() * 10, th.color, 0);
      }
    });

    // 3) 망토가 날아와 펄럭이며 둘러짐
    const C = o.cape, home = o.capeHome, cm = o.capeMat.uniforms;
    const fu = range(t, T.fly);
    cm.uTime.value = t;
    if (t < T.fly[0]) C.visible = false;
    else {
      C.visible = true;
      const e = easeOutCubic(fu);
      // 왼쪽 위에서 곡선을 그리며 등 뒤로
      const sx = home.x - 950, sy = home.y + 720, qx = home.x + 380, qy = home.y + 620;
      const it = 1 - e;
      C.position.set(it * it * sx + 2 * it * e * qx + e * e * home.x, it * it * sy + 2 * it * e * qy + e * e * home.y, 0);
      C.rotation.z = -1.1 * (1 - e) + Math.sin(t * 7) * 0.08 * (1 - e);
      const after = clamp01((t - T.fly[1]) / 0.6);
      const amp = fu < 1 ? lerp(1, 0.35, e) : 0.35 * (1 - easeOutCubic(after));
      cm.uAmp.value = amp;
      const flapX = 1 + 0.22 * Math.sin(t * 16) * amp;
      C.scale.set(lerp(0.4, 1, e) * flapX, lerp(0.55, 1, e), 1);
      cm.uGlow.value = fu < 1 ? 0.6 * (1 - e) + 0.3 : Math.max(0, 0.3 * (1 - after * 2));
      if (fu < 1 && Math.random() < 0.9) {
        emit(C.position.x + (Math.random() - 0.5) * 300, C.position.y - Math.random() * 300,
             (Math.random() - 0.5) * 60, 40, 0.6, 12 + Math.random() * 14, PALETTE.mint, -40);
      }
    }
    // 착지 → 세 번째 사진으로 전환
    const lt = t - T.fly[1];
    if (lt >= 0 && !bursted) {
      bursted = true;
      for (let i = 0; i < 90; i++) {
        const a = Math.random() * Math.PI * 2, s = 180 + Math.random() * 420;
        const c = toWorld(530, 720);
        emit(c.x + Math.cos(a) * 60, c.y + Math.sin(a) * 60, Math.cos(a) * s, Math.sin(a) * s + 60,
             0.7 + Math.random() * 0.7, 16 + Math.random() * 30, Math.random() < 0.5 ? PALETTE.mint : PALETTE.gold, -200);
      }
    }
    const cf = clamp01((lt - 0.05) / T.fade);
    o.base3.material.opacity = cf;
    o.base2.material.opacity = 1 - clamp01((lt - 0.05 - T.fade * 0.5) / (T.fade * 0.5));
    cm.uOpacity.value = 1 - clamp01((lt - 0.45) / 0.3);
    if (lt > 0.8) C.visible = false;

    // 4) 보호막 구체
    const su = range(t, T.shield);
    o.shield.visible = t >= T.shield[0];
    if (o.shield.visible) {
      const r = SHIELD_R * lerp(0.15, 1, easeOutBack(su, 1.2));
      o.shield.scale.set(r, r, r);
      o.shieldMat.uniforms.uTime.value = t;
      o.shieldMat.uniforms.uFlash.value = Math.max(0, 0.9 * (1 - su * 1.5));
      o.shieldMat.uniforms.uA.value = lerp(0.9, 0.55, range(t, T.dimOut)) * (0.9 + 0.1 * Math.sin(t * 2.2)) * clamp01(su * 3);
      if (su < 1 && Math.random() < 0.6) {
        const a = Math.random() * Math.PI * 2, sc = toWorld(...SHIELD_C);
        emit(sc.x + Math.cos(a) * r, sc.y + Math.sin(a) * r, 0, 0, 0.7, 14 + Math.random() * 12, PALETTE.mint, 0);
      }
    }
  }

  function stepParticles(dt) {
    for (let i = 0; i < MAX; i++) {
      const p = parts[i];
      if (!p.alive) { pAlpha[i] = 0; pSize[i] = 0; continue; }
      p.age += dt;
      if (p.age >= p.life) { p.alive = false; pAlpha[i] = 0; continue; }
      p.vx *= 0.965; p.vy = p.vy * 0.965 + p.grav * dt;
      p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.spin * dt;
      const k = p.age / p.life;
      pPos[i * 3] = p.x; pPos[i * 3 + 1] = p.y;
      pAlpha[i] = Math.sin(Math.PI * Math.min(1, k * 1.15));
      pSize[i] = p.size * (0.6 + 0.4 * Math.sin(Math.PI * k));
      pRot[i] = p.rot;
      pCol[i * 3] = p.color[0]; pCol[i * 3 + 1] = p.color[1]; pCol[i * 3 + 2] = p.color[2];
    }
    for (const n of ['position', 'aSize', 'aAlpha', 'aRot', 'aColor']) pGeo.attributes[n].needsUpdate = true;
  }

  return {
    play() { reset(); doneFired = false; clock.start = performance.now(); },
    resize,
    dispose() { disposed = true; cancelAnimationFrame(raf); window.removeEventListener('resize', resize); renderer.dispose(); }
  };
}

const { useEffect, useRef, useState, useCallback } = React;
const h = React.createElement;
function App() {
  const canvasRef = useRef(null), stageRef = useRef(null), audioRef = useRef(null);
  const [ready, setReady] = useState(false);
  const [phase, setPhase] = useState('idle');
  const [sound, setSound] = useState(true);
  useEffect(() => {
    const stage = createStage(canvasRef.current, { onReady: () => setReady(true), onDone: () => setPhase('done') });
    stageRef.current = stage;
    return () => stage.dispose();
  }, []);
  const play = useCallback(() => {
    if (!stageRef.current) return;
    if (sound) {
      if (!audioRef.current) audioRef.current = createAudio();
      const a = audioRef.current;
      if (a) { if (a.ctx.state === 'suspended') a.ctx.resume(); a.schedule(); }
    }
    stageRef.current.play(); setPhase('playing');
  }, [sound]);
  const label = phase === 'idle' ? '재생' : phase === 'playing' ? '재생 중…' : '다시 보기';
  return h('div', { className: 'app' },
    h('canvas', { ref: canvasRef, 'aria-label': '마법진과 빛의 실타래 속에서 마법사에게 초록 망토가 둘러지는 애니메이션' }),
    !ready && h('div', { className: 'loading' }, '불러오는 중…'),
    h('div', { className: 'bar' },
      h('button', { className: 'play', onClick: play, disabled: !ready || phase === 'playing' }, label),
      h('button', { className: 'sound', 'aria-pressed': String(sound), onClick: () => setSound((s) => !s) }, sound ? '소리 켜짐' : '소리 꺼짐')));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(App));

})();
</script>
</body>
